<title>markwylde.com Bento variants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Sans:wght@400..700&family=Manrope:wght@400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<style>
/* Five concepts over one shared markup. Each concept is a token set plus a
   layout block scoped by :root[data-design="n"]; the base rules below are
   only what all five agree on. Default tokens are concept 1 (Note). */
:root {
  --bg: #ffffff; --surface: #f5f6f8; --surface-2: #eef0f4;
  --fg: #3a4150; --heading: #12151c; --muted: #6c7483; --line: #e4e7ed;
  --accent: #2456d6; --on-accent: #ffffff; --accent-soft: #eaf0fe;
  --code-bg: #f5f6f9; --art-bg: #eef1f7;
  --tok-k: #9a3fb5; --tok-s: #1f7a4d; --tok-c: #7b8494;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: var(--font-body);
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --gutter: clamp(16px, 4vw, 40px);
  --bar-h: 0px;
  --bar-bg: #15171c; --bar-fg: #e8eaef; --bar-mute: #9299a8; --bar-line: #2c303a;
  --bar-on: #ffffff; --bar-on-fg: #111318;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1a1d24; --surface-2: #222630;
    --fg: #c5cad5; --heading: #f2f4f8; --muted: #8b93a3; --line: #2a2e39;
    --accent: #8fb0ff; --on-accent: #0c1220; --accent-soft: #1b2440;
    --code-bg: #171a21; --art-bg: #dfe4ee;
    --tok-k: #d7a2ea; --tok-s: #8fd3a8; --tok-c: #7f8898;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d24; --surface-2: #222630;
  --fg: #c5cad5; --heading: #f2f4f8; --muted: #8b93a3; --line: #2a2e39;
  --accent: #8fb0ff; --on-accent: #0c1220; --accent-soft: #1b2440;
  --code-bg: #171a21; --art-bg: #dfe4ee;
  --tok-k: #d7a2ea; --tok-s: #8fd3a8; --tok-c: #7f8898;
  color-scheme: dark;
}

/* ---------- tokens per Bento variant ---------- */
:root { --radius: 1.5rem; --gap: 1rem; --pad: clamp(1.25rem, 3vw, 2.25rem); --link: var(--accent); --t1: var(--surface-2); --t2: var(--surface-2); --t3: var(--surface-2); }

/* 1 Tight */
:root[data-design="1"] {
  --bg: #eceef2; --surface: #ffffff; --surface-2: #f2f4f7;
  --fg: #454b59; --heading: #10131a; --muted: #6b7282; --line: #e3e6ec;
  --accent: #0b6bcb; --on-accent: #ffffff; --accent-soft: #dcebfa;
  --code-bg: #f2f4f7; --art-bg: #dcebfa;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-design="1"][data-theme="dark"] {
  --bg: #0c0e13; --surface: #171a22; --surface-2: #20242e;
  --fg: #c3c8d4; --heading: #f3f5f9; --muted: #8a92a2; --line: #2a2f3b;
  --accent: #6db3f7; --on-accent: #06203a; --accent-soft: #1a2c40;
  --code-bg: #12151c; --art-bg: #cfe2f6;
}
/* 2 Mosaic */
:root[data-design="2"] {
  --bg: #e9ebf0; --surface: #ffffff; --surface-2: #f1f3f7;
  --fg: #454b59; --heading: #10131a; --muted: #6b7282; --line: #e3e6ec;
  --accent: #0b6bcb; --on-accent: #ffffff; --accent-soft: #dcebfa;
  --code-bg: #f1f3f7; --art-bg: #dcebfa;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 1.25rem; --gap: .75rem;
}
:root[data-design="2"][data-theme="dark"] {
  --bg: #0b0d12; --surface: #161920; --surface-2: #1f232d;
  --fg: #c3c8d4; --heading: #f3f5f9; --muted: #8a92a2; --line: #2a2f3b;
  --accent: #6db3f7; --on-accent: #06203a; --accent-soft: #1a2c40;
  --code-bg: #12151c; --art-bg: #cfe2f6;
}
/* 3 Outline */
:root[data-design="3"] {
  --bg: #fbfbfc; --surface: #fbfbfc; --surface-2: #f0f1f5;
  --fg: #414858; --heading: #131722; --muted: #6a7284; --line: #d5d9e2;
  --accent: #4f46e5; --on-accent: #ffffff; --accent-soft: #edecfd;
  --code-bg: #f0f1f5; --art-bg: #edecfd;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 0px; --gap: 0px;
}
:root[data-design="3"][data-theme="dark"] {
  --bg: #0d111c; --surface: #0d111c; --surface-2: #171d2e;
  --fg: #c1c9da; --heading: #f1f4fa; --muted: #8791a8; --line: #2a3350;
  --accent: #9a94ff; --on-accent: #0f0d2e; --accent-soft: #1f2147;
  --code-bg: #111727; --art-bg: #dfe3f3;
}
/* 4 Colour */
:root[data-design="4"] {
  --bg: #f3f1ee; --surface: #ffffff; --surface-2: #f3f3f5;
  --fg: #44474f; --heading: #101218; --muted: #6c707b; --line: #e4e4e8;
  --accent: #2450d8; --on-accent: #ffffff; --accent-soft: #e2e9fd; --link: #2450d8;
  --code-bg: #f3f3f5; --art-bg: transparent;
  --t1: #ffe7bf; --t2: #d6f1df; --t3: #e5dffb;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --radius: 2rem;
}
:root[data-design="4"][data-theme="dark"] {
  --bg: #0c0d11; --surface: #17191f; --surface-2: #21242c;
  --fg: #c6c9d2; --heading: #f4f5f8; --muted: #8d919d; --line: #2b2e38;
  --accent: #3360ea; --on-accent: #ffffff; --accent-soft: #1b2548; --link: #9db4ff;
  --code-bg: #121419; --art-bg: transparent;
  --t1: #3c2f12; --t2: #153324; --t3: #2a2350;
}
/* 5 Split */
:root[data-design="5"] {
  --bg: #e9edec; --surface: #ffffff; --surface-2: #f0f4f3;
  --fg: #434c4b; --heading: #0f1514; --muted: #667170; --line: #e0e6e5;
  --accent: #0f766e; --on-accent: #ffffff; --accent-soft: #d5efec;
  --code-bg: #f0f4f3; --art-bg: #d5efec;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 1.25rem; --gap: .75rem;
}
:root[data-design="5"][data-theme="dark"] {
  --bg: #0a0f0e; --surface: #141b1a; --surface-2: #1d2625;
  --fg: #c2cccb; --heading: #f1f6f5; --muted: #869493; --line: #27312f;
  --accent: #5fd4c8; --on-accent: #04302c; --accent-soft: #143531;
  --code-bg: #101615; --art-bg: #c9e9e5;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow-wrap: break-word;
}
.site h1, .site h2, .site h3, .site p, .site ul { margin: 0; padding: 0; }
.site ul { list-style: none; }
.site h1, .site h2, .site h3 { color: var(--heading); font-family: var(--font-display); text-wrap: balance; line-height: 1.2; }
.site a { color: inherit; text-decoration: none; }
.site img { display: block; max-width: 100%; }
.site :focus-visible, .pbar :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.site { padding-inline: var(--gutter); margin-inline: auto; }

.hdr-in { display: flex; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .65rem; }
.brand-av { width: 2.25rem; height: 2.25rem; border-radius: 50%; object-fit: cover; flex: none; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.25; }
.brand-name { color: var(--heading); font-weight: 600; white-space: nowrap; }
.brand-role { color: var(--muted); font-size: .8rem; }
.nav { display: flex; gap: .15rem; margin-left: auto; }
.nav a { padding: .4rem .6rem; font-size: .95rem; }
.hdr-links { display: none; }
.mode {
  display: grid; place-items: center; width: 2.25rem; height: 2.25rem; padding: 0;
  background: none; border: 1px solid var(--line); border-radius: 8px;
  color: var(--fg); cursor: pointer;
}
.mode:hover { color: var(--accent); border-color: var(--accent); }

.eyebrow { color: var(--muted); font-size: .9rem; }
.hero-art img { width: 100%; height: auto; }
.stack { display: flex; flex-wrap: wrap; gap: .4rem; }
.cta, .links { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
.logos { display: flex; flex-wrap: wrap; gap: 1.25rem 2.25rem; align-items: center; }
.logos img { width: 7rem; height: 2rem; object-fit: contain; filter: grayscale(1); opacity: .7; }
.logo-d, :root[data-theme="dark"] .logo-l { display: none; }
:root[data-theme="dark"] .logo-d { display: block; }
.proj a { display: flex; gap: 1rem; align-items: center; }
.proj img { width: 2.25rem; height: 2.25rem; flex: none; object-fit: contain; }
.proj .txt { min-width: 0; flex: 1; }
.proj h3 { font-size: 1rem; }
.proj p { color: var(--muted); font-size: .95rem; line-height: 1.45; }
.arrow { flex: none; color: var(--muted); transition: transform .15s ease; }
.proj a:hover .arrow { transform: translateX(3px); color: var(--accent); }
.post-row a { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: .25rem 1rem; }
.post-row time { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; padding-top: .15em; }
.post-row h3 { font-size: 1.05rem; }
.post-row p { color: var(--muted); font-size: .95rem; margin-top: .25rem; }
.post-row a:hover h3 { color: var(--link); }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
.tags li { font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: .05rem .4rem; }
.home .post-row p, .home .post-row .tags { display: none; }
.more { display: inline-block; margin-top: 1rem; color: var(--link); font-weight: 600; }
.email { color: var(--link); font-weight: 600; }
.page-head p { color: var(--muted); margin-top: .5rem; }
.about-side img { width: 9rem; }
.about-side h3 { font-size: 1.1rem; margin-block: 1rem .5rem; }
.about-side .links { margin-top: 1rem; }
.back { color: var(--muted); font-size: .9rem; }
.back:hover { color: var(--accent); }
.post-meta { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; color: var(--muted); font-size: .9rem; margin-top: .75rem; }
.post-meta .tags { margin-top: 0; }
.ftr { color: var(--muted); font-size: .875rem; padding-block: 2.5rem; }

.prose { max-width: 68ch; }
.site .prose > * + * { margin-top: 1.1em; }
.site .prose h2, .site .prose h3 { margin-top: 2em; font-size: 1.35em; }
.site .prose h3 { font-size: 1.1em; }
.prose a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.prose ul { list-style: disc; padding-left: 1.25rem; }
.prose li + li { margin-top: .35em; }
.prose code { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: .1em .35em; }
.prose pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; overflow-x: auto; font-size: .85rem; line-height: 1.6; tab-size: 2; }
.prose pre code { background: none; border: 0; padding: 0; font-size: inherit; color: var(--heading); }
.tok-k { color: var(--tok-k); } .tok-s { color: var(--tok-s); } .tok-c { color: var(--tok-c); font-style: italic; }
.prose blockquote { margin-inline: 0; padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--heading); }
.tablewrap { overflow-x: auto; }
.prose table { border-collapse: collapse; width: 100%; font-size: .95em; }
.prose th, .prose td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { color: var(--heading); font-weight: 600; white-space: nowrap; }

/* ---------- prototype switcher (not part of any design) ---------- */
.pbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: var(--bar-bg); color: var(--bar-fg);
  font: 500 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 6px max(10px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
}
.pbar-row { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
.pbar-l { color: var(--bar-mute); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.seg { display: flex; gap: 2px; background: var(--bar-line); border-radius: 8px; padding: 2px; overflow-x: auto; scrollbar-width: none; }
.seg button, .pbar-btn {
  font: inherit; color: var(--bar-fg); background: none; border: 0; border-radius: 6px;
  padding: 6px 10px; cursor: pointer; white-space: nowrap; display: flex; gap: 6px;
}
.seg button b { font-weight: 700; color: var(--bar-mute); }
.seg button[aria-pressed="true"] { background: var(--bar-on); color: var(--bar-on-fg); }
.seg button[aria-pressed="true"] b { color: inherit; }
.pbar-btn { border: 1px solid var(--bar-line); margin-left: auto; }
.pbar-desc { color: var(--bar-mute); font-weight: 400; flex: 1 1 14rem; min-width: 0; }
@media (max-width: 640px) {
  .pbar-l, .pbar-desc { display: none; }
  .pbar-row { flex: 1 1 100%; }
  #seg-design { flex: 1; } #seg-design button { flex: 1; justify-content: center; padding-inline: 4px; }
  #seg-design button:not([aria-pressed="true"]) span { display: none; }
}

/* ---------- Bento base: what all five variants share ---------- */
.site { max-width: 76rem; }
.hdr { padding-top: 1rem; }
.hdr-in { background: var(--surface); border-radius: 999px; padding: .4rem .4rem .4rem .5rem; flex-wrap: nowrap; }
.brand-role { display: none; }
.brand-name { font-weight: 700; }
.nav a { border-radius: 999px; font-weight: 600; font-size: .9rem; padding: .45rem .8rem; color: var(--muted); }
.nav a:hover { color: var(--heading); }
.nav a[aria-current] { background: var(--heading); color: var(--bg); }
.mode { border-radius: 50%; border-color: transparent; background: var(--surface-2); flex: none; }
.main { margin-top: var(--gap); }
.main.home { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.hero { display: contents; }
.hero-copy, .hero-art, .blk, .page { background: var(--surface); border-radius: var(--radius); }
.hero-copy, .blk, .page { padding: var(--pad); }
.hero-copy { grid-column: span 8; display: grid; gap: 1rem; justify-items: start; align-content: center; }
/* the vector fills its tile edge to edge: no empty backdrop above or beside it */
.hero-art { grid-column: span 4; overflow: hidden; background: var(--art-bg); }
.hero-art img { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
.eyebrow { font-weight: 600; font-size: .85rem; }
.hero h1 { font-size: clamp(2rem, 5.5vw, 3.4rem); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }
.lede { font-size: 1.2rem; font-weight: 500; color: var(--heading); line-height: 1.4; }
.stack li { background: var(--surface-2); border-radius: 999px; padding: .2rem .7rem; font-size: .82rem; font-weight: 600; }
.btn, .links a { border-radius: 999px; padding: .6rem 1.1rem; font-weight: 700; font-size: .92rem; background: var(--surface-2); color: var(--heading); }
.btn:hover, .links a:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.blk { grid-column: span 12; }
.blk > h2, .year > h2 { font-size: .95rem; font-weight: 800; margin-bottom: 1.1rem; }
.stats { display: none; }
.stat-list b { display: block; font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.75rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--heading); }
.stat-list span { font-size: .85rem; font-weight: 600; line-height: 1.3; }
.clients { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2.5rem; }
.clients > h2 { margin: 0; color: var(--muted); }
.how-list { display: grid; gap: 1.1rem; }
.how-list h3 { font-size: 1rem; font-weight: 700; }
.how-list p { color: var(--muted); font-size: .95rem; }
.proj-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: .75rem; }
.proj a { height: 100%; background: var(--surface-2); border-radius: calc(var(--radius) * .66); padding: 1rem; flex-direction: column; align-items: flex-start; gap: .75rem; }
.proj a:hover { background: var(--accent-soft); }
.proj h3 { font-weight: 700; }
.proj .arrow { display: none; }
.posts { display: grid; gap: .25rem; }
.post-row a { padding: .7rem .8rem; margin-inline: -.8rem; border-radius: .75rem; }
.post-row a:hover { background: var(--surface-2); }
.post-row h3 { font-weight: 700; }
.more { font-weight: 700; }
.contact { background: var(--accent); color: var(--on-accent); display: grid; gap: 1rem; align-content: start; }
.contact > h2 { color: inherit; margin: 0; font-size: 1.5rem; letter-spacing: -.02em; }
.contact .email { color: inherit; font-size: 1.15rem; font-weight: 800; text-decoration: underline; text-underline-offset: 5px; }
.contact .links a { background: none; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
/* inner pages span the same width as the header and the home grid; only the
   reading column inside a post is narrowed */
.page.post > * { max-width: 46rem; }
.about .prose { max-width: none; }
.page-head { margin-bottom: 2rem; }
.page-head h1, .post-head h1 { font-size: clamp(1.9rem, 6vw, 2.8rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.post-head { margin-bottom: 2rem; }
.post-head h1 { margin-top: 1rem; }
.year + .year { margin-top: 2rem; }
.about-body { display: grid; grid-template-columns: minmax(0, 1fr) 19rem; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
.about-side { background: var(--surface-2); border-radius: calc(var(--radius) * .66); padding: 1.25rem; }
.tags li { border: 0; background: var(--surface-2); border-radius: 999px; padding: .1rem .55rem; font-weight: 600; }
.prose { font-size: 1.03rem; line-height: 1.7; }
.ftr { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 860px) {
  .hero-copy, .hero-art { grid-column: span 12; }
  .about-body { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .brand-txt { display: none; }
  .nav a { padding: .45rem .6rem; font-size: .85rem; }
  .hdr-in { gap: .25rem; }
  .post-row a { grid-template-columns: 1fr; }
}

/* ================= 1 · TIGHT — one hero tile, vector on a tight disc, even rows ================= */
:root[data-design="1"] {
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) clamp(13rem, 30vw, 23rem); gap: 0 1rem; grid-column: span 12; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .hero-copy { background: none; grid-column: auto; }
  .hero-art { background: none; grid-column: auto; border-radius: 0; overflow: visible; position: relative; align-self: end; margin-right: var(--pad); padding-top: var(--pad); }
  .hero-art::before { content: ""; position: absolute; left: 0; right: 0; top: 16%; aspect-ratio: 1; border-radius: 50%; background: var(--art-bg); }
  .hero-art img { position: relative; height: auto; object-fit: contain; }
  .how { background: none; padding: 0; }
  .how > h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .how-list { grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: var(--gap); }
  .how-list li { background: var(--surface); border-radius: var(--radius); padding: 1.5rem var(--pad); }
  .projects { grid-column: span 7; }
  .writing { grid-column: span 5; }
  .writing .post-row a { grid-template-columns: 1fr; }
  .contact { grid-template-columns: minmax(0, 1fr) auto; gap: .75rem 3rem; align-items: center; }

    const years = [...new Set(items.map((p) => p[0].slice(0, 4)))];
    return `<article class="page blog">
      <header class="page-head"><h1>${title}</h1><p>${sub}</p></header>
      ${years.map((y) => `<section class="year"><h2>${y}</h2><ul class="posts">${items.filter((p) => p[0].startsWith(y)).map(postRow).join("")}</ul></section>`).join("")}
    </article>`;
  },
  research: () => VIEWS.blog(RESEARCH, "Research", "Long-form notes and deep dives. Less polished than the blog."),

  post: () => `
    <article class="page post">
      <header class="post-head">
        <a class="back" href="#" data-go="blog">← Blog</a>
        <h1>How to create a native http server</h1>
        <div class="post-meta"><time datetime="2022-12-11">11 December 2022</time><ul class="tags"><li>Node.js</li><li>HTTP</li><li>JavaScript</li></ul></div>
      </header>
      <div class="prose">
        <p>NodeJS is a powerful and popular JavaScript runtime that allows you to build a wide range of applications, including native HTTP servers. In this article, we will explore how to create a simple HTTP server using NodeJS.</p>
        <p>Once you have NodeJS installed, you can create a new file called <code>server.js</code> and open it in your favorite text editor.</p>
        <h2>Import the module</h2>
        <p>The first thing we need to do is to import the <code>http</code> module, which provides all of the functionality we need to create an HTTP server.</p>
        ${code("import http from 'http';")}
        <h2>Handle a request</h2>
        <p>Next, we will use the <code>http.createServer()</code> method to create a new HTTP server. This method takes a callback function as an argument, which will be executed every time the server receives a new request.</p>
        ${code("const server = http.createServer((request, response) => {\n  response.statusCode = 200;\n  response.setHeader('Content-Type', 'text/html');\n  response.end('<h1>Hello, World!</h1>'); // the whole page, in one call\n});")}
        <blockquote><p>With these few lines of code, you can create a simple HTTP server using NodeJS.</p></blockquote>
        <h2>Listen on a port</h2>
        <p>Finally, we need to start the server and listen for incoming requests on a specific port.</p>
        ${code("server.listen(3000, () => {\n  console.log('Server is listening on port 3000');\n});")}
        <div class="tablewrap"><table>
          <thead><tr><th>Call</th><th>What it does</th></tr></thead>
          <tbody>
            <tr><td><code>http.createServer()</code></td><td>Creates the server and runs your callback for every request</td></tr>
            <tr><td><code>response.setHeader()</code></td><td>Sets a header such as the content type</td></tr>
            <tr><td><code>response.end()</code></td><td>Sends the body and finishes the response</td></tr>
            <tr><td><code>server.listen()</code></td><td>Starts listening on a port, then calls back when ready</td></tr>
          </tbody>
        </table></div>
        <p>You can then use this server to handle requests and generate responses for your application.</p>
      </div>
    </article>`,
};

const root = document.documentElement;
const state = { design: 1, page: "home" };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

function readHash() {
  const m = /^#d([1-5])-(home|about|blog|research|post)$/.exec(location.hash);
  if (m) { state.design = +m[1]; state.page = m[2]; return true; }
  return false;
}
function render(scroll) {
  root.dataset.design = state.design;
  const view = document.getElementById("view");
  view.className = `main ${state.page}`;
  view.innerHTML = VIEWS[state.page]();
  const navPage = state.page === "post" ? "blog" : state.page;
  document.querySelectorAll(".nav a").forEach((a) => a.dataset.go === navPage ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelectorAll("#seg-design button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.d === state.design));
  document.querySelectorAll("#seg-page button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.p === state.page));
  document.getElementById("pbar-desc").textContent = DESIGNS[state.design - 1][1];
  document.getElementById("pbar-theme").textContent = root.dataset.theme === "dark" ? "Light" : "Dark";
  try { history.replaceState(null, "", `#d${state.design}-${state.page}`); } catch {}
  store.set("mw-bento", `${state.design}-${state.page}`);
  if (scroll) window.scrollTo(0, 0);
}
function setTheme(t) { root.dataset.theme = t; store.set("mw-theme", t); render(false); }

document.getElementById("seg-design").innerHTML = DESIGNS.map(([n], i) => `<button type="button" id="d-btn-${i + 1}" data-d="${i + 1}" title="${n}"><b>${i + 1}</b><span>${n}</span></button>`).join("");
document.getElementById("seg-page").innerHTML = PAGES.map(([p, n]) => `<button type="button" id="p-btn-${p}" data-p="${p}">${n}</button>`).join("");

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]"), d = e.target.closest("[data-d]"), p = e.target.closest("[data-p]");
  if (go) { e.preventDefault(); state.page = go.dataset.go; render(true); }
  else if (d) { state.design = +d.dataset.d; render(false); }
  else if (p) { state.page = p.dataset.p; render(true); }
  else if (e.target.closest("#mode, #pbar-theme")) setTheme(root.dataset.theme === "dark" ? "light" : "dark");
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key >= "1" && e.key <= "5") { state.design = +e.key; render(false); }
});
window.addEventListener("hashchange", () => { if (readHash()) render(true); });
new ResizeObserver(([en]) => root.style.setProperty("--bar-h", `${en.target.offsetHeight}px`)).observe(document.getElementById("pbar"));

if (!readHash()) { const m = /^([1-5])-(\w+)$/.exec(store.get("mw-bento") || ""); if (m && VIEWS[m[2]]) { state.design = +m[1]; state.page = m[2]; } }
root.dataset.theme = store.get("mw-theme") || root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
render(false);
</script>
